# Local infrastructure only; apps run natively (rule 17). Never reuse these volumes elsewhere.
name: stepler-app

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in docker/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in docker/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set in docker/.env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - stepler-pg:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stepler-pg:
