# Local infrastructure only; apps run natively (rule 17). Never reuse these volumes elsewhere.
name: stepler-app

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in docker/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in docker/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set in docker/.env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - stepler-pg:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible emulator (ADR 0008, spike S4). Buckets and CORS: `pnpm --filter @stepler/api storage:bootstrap`.
  s3:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    # Small volumes, more of them: the defaults (1 GB each, several grown per bucket on first
    # write) can exhaust a CI runner's disk and fail the first upload with a 500.
    command:
      [
        'server',
        '-dir=/data',
        '-s3',
        '-s3.port=8333',
        '-master.volumeSizeLimitMB=64',
        '-volume.max=100',
      ]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set in docker/.env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set in docker/.env}
    ports:
      - '127.0.0.1:8333:8333'
      # Filer web UI to browse buckets (/buckets/). No auth: localhost only, never publish it wider.
      - '127.0.0.1:8888:8888'
    volumes:
      - stepler-s3:/data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8333/healthz']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  stepler-pg:
  stepler-s3:
