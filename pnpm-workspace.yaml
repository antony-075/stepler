packages:
  - apps/*
  - packages/*
  - e2e

# Shared versions. Keep in sync with docs/development/README.md.
catalog:
  typescript: 6.0.3
  vitest: 4.1.11
  '@types/node': 24.19.0
  eslint: 9.39.5
  zod: 4.6.5
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  # next and @next/eslint-plugin-next must move together.
  next: 16.3.6
  '@next/eslint-plugin-next': 16.3.6
  tailwindcss: 4.3.3
  playwright: 1.63.0
  '@playwright/test': 1.63.0

# pnpm 11 blocks dependency build scripts unless listed here.
allowBuilds:
  '@scarf/scarf': false
  unrs-resolver: false
  '@swc/core': true
  sharp: false
  '@parcel/watcher': false
  esbuild: true
