<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>T4 · Листівка, комп’ютер</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500..700&amp;family=Nunito:ital,wght@0,400..800;1,400..800&amp;display=swap">
<style>
body{margin:0}
a{color:#2E4E8F}a:hover{color:#24304F}
.st{border:0;padding:5px;margin:0;cursor:pointer;font:inherit;text-align:left;transition:box-shadow 140ms ease-out}
.st-red{background:radial-gradient(circle at 5px 5px,#FFFCF5 2.6px,transparent 3px) -5px -5px/10px 10px,#B3303B}
.st-navy{background:radial-gradient(circle at 5px 5px,#FFFCF5 2.6px,transparent 3px) -5px -5px/10px 10px,#2E4E8F}
.st:hover{box-shadow:0 10px 18px -10px rgba(36,48,79,0.6)}
.t4-lang:hover{background:#FFFFFF}
.t4-add:hover{background:rgba(255,252,245,0.85)}
.st:focus-visible,.t4-lang:focus-visible,.t4-add:focus-visible,a:focus-visible{outline:2px solid #24304F;outline-offset:3px}
.ph{position:relative;overflow:hidden}
.ph::after{content:"";position:absolute;inset:0;background:radial-gradient(100% 70% at 25% 15%,rgba(255,255,255,0.35),rgba(255,255,255,0) 60%);pointer-events:none}
.pill{position:absolute;z-index:1;bottom:6px;padding:2px 7px;border-radius:999px;background:rgba(36,48,79,0.88);color:#FFFFFF;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px}
.pol{margin:0;padding:6px 6px 22px;background:#FFFFFF;box-shadow:0 10px 18px -12px rgba(36,48,79,0.55)}
@media (prefers-reduced-motion: reduce){.st{transition:none}}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; overflow: hidden; background: radial-gradient(rgba(255, 255, 255, 0.6) 1.6px, transparent 2px) 0 0 / 20px 20px, #C9D7E8; color: #24304F; font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center">

  <header style="align-self: stretch; height: 68px; padding: 0 40px; display: flex; align-items: center; justify-content: flex-end">
    <button type="button" class="t4-lang" aria-label="Мова: українська. Змінити мову" style="height: 44px; padding: 0 14px; border: 0; border-radius: 999px; background: rgba(255, 252, 245, 0.85); color: #24304F; font: inherit; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; cursor: pointer">
      <svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true"><rect width="18" height="6" rx="1" fill="#0057B7"></rect><rect y="6" width="18" height="6" rx="1" fill="#FFD700"></rect></svg>
      Українська
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
  </header>

  <article aria-labelledby="t4d-title" style="width: 1120px; box-sizing: border-box; padding: 10px; border-radius: 12px; background: repeating-linear-gradient(135deg, #B3303B 0 16px, #FFFCF5 16px 24px, #2E4E8F 24px 40px, #FFFCF5 40px 48px); box-shadow: 0 30px 60px -34px rgba(36, 48, 79, 0.6)">
    <div style="border-radius: 6px; background: #FFFCF5; padding: 30px 32px; display: grid; grid-template-columns: 284px minmax(0, 1fr) 1px 262px; gap: 0 34px; align-items: start">

      <figure style="position: relative; margin: 6px 0 0; padding: 12px 12px 44px; background: #FFFFFF; transform: rotate(-4deg); box-shadow: 0 1px 2px rgba(36, 48, 79, 0.12), 0 16px 30px -14px rgba(36, 48, 79, 0.45)">
        <div class="ph" role="img" aria-label="Обкладинка" style="width: 100%; aspect-ratio: 1 / 1; background: linear-gradient(160deg, #F2C6A8 0%, #E3A27F 55%, #C97F62 100%)">
          <span aria-hidden="true" style="position: absolute; z-index: 1; right: 10px; bottom: 8px; font-size: 10px; color: rgba(255, 255, 255, 0.8)">IMG_2041</span>
        </div>
        <span aria-hidden="true" style="position: absolute; left: 50%; top: -14px; width: 104px; height: 28px; margin-left: -52px; transform: rotate(5deg); background: rgba(236, 222, 184, 0.82); box-shadow: 0 1px 1px rgba(36, 48, 79, 0.08)"></span>
      </figure>

      <div style="padding-top: 8px; min-width: 0">
        <h1 id="t4d-title" style="margin: 0; font-family: 'Comfortaa', 'Nunito', system-ui, sans-serif; font-size: 40px; line-height: 1.18; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance">Весілля Олі та&#160;Тараса</h1>
        <p style="margin: 22px 0 0; font-size: 18px; line-height: 34px; color: #3A4562; background: repeating-linear-gradient(to bottom, transparent 0 33px, #D5DCE8 33px 34px); text-wrap: pretty">Дякуємо, що ви з нами! Додайте свої фото й відео з цього вечора.</p>
        <p style="margin: 22px 0 0; font-size: 13px; line-height: 1.5; color: #4F5A73; max-width: 380px">Додаючи вміст, ви погоджуєтеся з <a href="#">Умовами використання</a> і <a href="#">Політикою конфіденційності</a>.</p>
      </div>

      <span aria-hidden="true" style="align-self: stretch; background: #D5DCE8"></span>

      <div style="position: relative; display: flex; flex-direction: column; align-items: flex-end; gap: 22px">
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; width: 100%">
          <button type="button" class="st st-red" style="transform: rotate(-2deg)">
            <span style="display: flex; flex-direction: column; justify-content: space-between; gap: 12px; min-height: 120px; box-sizing: border-box; padding: 12px 12px 10px; background: #B3303B; color: #FFFFFF; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.5)">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path><circle cx="12" cy="13" r="3"></circle></svg>
              <span style="font-family: 'Comfortaa', 'Nunito', sans-serif; font-size: 16px; line-height: 1.2; font-weight: 700">Додати фото й відео</span>
            </span>
          </button>
          <button type="button" class="st st-navy" style="transform: rotate(1.5deg)">
            <span style="display: flex; flex-direction: column; justify-content: space-between; gap: 12px; min-height: 120px; box-sizing: border-box; padding: 12px 12px 10px; background: #FFFCF5; color: #2E4E8F; box-shadow: inset 0 0 0 1.5px #2E4E8F">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
              <span style="font-family: 'Comfortaa', 'Nunito', sans-serif; font-size: 16px; line-height: 1.2; font-weight: 700">Написати побажання</span>
            </span>
          </button>
        </div>

        <div style="align-self: flex-start; display: flex; align-items: center; gap: 4px; margin-left: 6px">
          <div style="width: 96px; height: 96px; box-sizing: border-box; border: 4px double #2E4E8F; border-radius: 50%; background: rgba(255, 252, 245, 0.9); transform: rotate(-12deg); display: flex; align-items: center; justify-content: center; text-align: center">
            <p style="margin: 0; font-family: 'Comfortaa', 'Nunito', sans-serif; font-size: 16px; line-height: 1.1; font-weight: 700; color: #2E4E8F">18<br>кадрів</p>
          </div>
          <svg width="130" height="44" viewBox="0 0 130 44" fill="none" stroke="#2E4E8F" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="opacity: 0.55"><path d="M2 8c10-6 20 6 30 0s20 6 30 0 20 6 30 0 20 6 30 0"></path><path d="M2 22c10-6 20 6 30 0s20 6 30 0 20 6 30 0 20 6 30 0"></path><path d="M2 36c10-6 20 6 30 0s20 6 30 0 20 6 30 0 20 6 30 0"></path></svg>
        </div>
      </div>
    </div>
  </article>

  <div style="width: 1120px; margin-top: 34px; display: flex; flex-direction: column; gap: 30px">
    <section aria-labelledby="t4d-mine">
      <div style="display: flex; align-items: baseline; gap: 16px">
        <h2 id="t4d-mine" style="margin: 0; font-family: 'Comfortaa', 'Nunito', sans-serif; font-size: 24px; font-weight: 700">Ваші кадри</h2>
        <span style="font-size: 15px; font-weight: 600">6 кадрів</span>
      </div>
      <div style="margin-top: 16px; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 24px">
        <figure class="pol" style="transform: rotate(-2deg)"><div class="ph" role="img" aria-label="Ваше фото, кадр 18" style="aspect-ratio: 1 / 1; border-radius: 2px; background: linear-gradient(160deg, #F1DFA6 0%, #DCC07A 100%)"><span class="pill" style="left: 6px">#018</span></div></figure>
        <figure class="pol" style="transform: rotate(1.5deg)"><div class="ph" role="img" aria-label="Ваше відео, кадр 17, 12 секунд" style="aspect-ratio: 1 / 1; border-radius: 2px; background: linear-gradient(160deg, #B8D0E6 0%, #8FB0D3 100%)"><span class="pill" style="left: 6px">#017</span><span class="pill" style="right: 6px"><svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="6 3 21 12 6 21 6 3"></polygon></svg>0:12</span></div></figure>
        <figure style="margin: 0; position: relative; padding: 16px 12px 10px; background: #FFF0B3; transform: rotate(-1deg); box-shadow: 0 10px 18px -12px rgba(36, 48, 79, 0.55); display: flex; flex-direction: column">
          <span aria-hidden="true" style="position: absolute; left: 50%; top: -9px; width: 50px; height: 18px; margin-left: -25px; transform: rotate(-5deg); background: rgba(236, 222, 184, 0.85)"></span>
          <span aria-hidden="true" style="font-family: 'Comfortaa', sans-serif; font-size: 38px; line-height: 0.6; height: 18px; font-weight: 700; color: #B3303B">&#8220;</span>
          <blockquote style="margin: 4px 0 0; font-size: 13px; line-height: 1.35; font-weight: 600; color: #24304F">Щастя вам і тепла, рідні!</blockquote>
          <figcaption style="margin-top: auto; padding-top: 6px"><span style="padding: 2px 7px; border-radius: 999px; background: rgba(36, 48, 79, 0.88); color: #FFFFFF; font-size: 12px; font-weight: 700">#016</span></figcaption>
        </figure>
        <figure class="pol" style="transform: rotate(2deg)"><div class="ph" role="img" aria-label="Ваше фото, кадр 15" style="aspect-ratio: 1 / 1; border-radius: 2px; background: linear-gradient(160deg, #BFDCCB 0%, #93BFA5 100%)"><span class="pill" style="left: 6px">#015</span></div></figure>
        <figure class="pol" style="transform: rotate(-1.5deg)"><div class="ph" role="img" aria-label="Ваше фото, кадр 14" style="aspect-ratio: 1 / 1; border-radius: 2px; background: linear-gradient(160deg, #EFB3A8 0%, #D98778 100%)"><span class="pill" style="left: 6px">#014</span></div></figure>
        <figure class="pol" style="transform: rotate(1deg)"><div class="ph" role="img" aria-label="Ваше фото, кадр 13" style="aspect-ratio: 1 / 1; border-radius: 2px; background: linear-gradient(160deg, #D6C8E8 0%, #B3A0D2 100%)"><span class="pill" style="left: 6px">#013</span></div></figure>
        <button type="button" class="t4-add" style="border: 2px dashed #2E4E8F; border-radius: 4px; background: rgba(255, 252, 245, 0.55); color: #2E4E8F; font: inherit; font-family: 'Comfortaa', 'Nunito', sans-serif; font-size: 15px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Додати ще
        </button>
      </div>
    </section>

    <section aria-labelledby="t4d-all">
      <div style="display: flex; align-items: baseline; gap: 16px">
        <h2 id="t4d-all" style="margin: 0; font-family: 'Comfortaa', 'Nunito', sans-serif; font-size: 24px; font-weight: 700">Усі кадри</h2>
        <span style="font-size: 15px; font-weight: 600">18 кадрів</span>
      </div>
      <div style="margin-top: 16px; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 24px">
        <figure class="pol" style="transform: rotate(1deg)"><div class="ph" role="img" aria-label="Фото гостя, кадр 12" style="aspect-ratio: 1 / 1; border-radius: 2px; background: linear-gradient(160deg, #F4D2B8 0%, #E2A988 100%)"><span class="pill" style="left: 6px">#012</span></div></figure>
        <figure class="pol" style="transform: rotate(-2deg)"><div class="ph" role="img" aria-label="Фото гостя, кадр 11" style="aspect-ratio: 1 / 1; border-radius: 2px; background: linear-gradient(160deg, #C4D8C0 0%, #9DBE97 100%)"><span class="pill" style="left: 6px">#011</span></div></figure>
        <figure class="pol" style="transform: rotate(1.5deg)"><div class="ph" role="img" aria-label="Відео гостя, кадр 10, 41 секунда" style="aspect-ratio: 1 / 1; border-radius: 2px; background: linear-gradient(160deg, #C3CDEA 0%, #9DAAD8 100%)"><span class="pill" style="left: 6px">#010</span><span class="pill" style="right: 6px"><svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="6 3 21 12 6 21 6 3"></polygon></svg>0:41</span></div></figure>
        <figure class="pol" style="transform: rotate(-1deg)"><div class="ph" role="img" aria-label="Фото гостя, кадр 9" style="aspect-ratio: 1 / 1; border-radius: 2px; background: linear-gradient(160deg, #F1DFA6 0%, #D9B866 100%)"><span class="pill" style="left: 6px">#009</span></div></figure>
        <figure class="pol" style="transform: rotate(2deg)"><div class="ph" role="img" aria-label="Фото гостя, кадр 8" style="aspect-ratio: 1 / 1; border-radius: 2px; background: linear-gradient(160deg, #EFB3A8 0%, #D2806F 100%)"><span class="pill" style="left: 6px">#008</span></div></figure>
        <figure class="pol" style="transform: rotate(-1.5deg)"><div class="ph" role="img" aria-label="Фото гостя, кадр 7" style="aspect-ratio: 1 / 1; border-radius: 2px; background: linear-gradient(160deg, #B8D0E6 0%, #86A8CF 100%)"><span class="pill" style="left: 6px">#007</span></div></figure>
        <figure class="pol" style="transform: rotate(1deg)"><div class="ph" role="img" aria-label="Фото гостя, кадр 6" style="aspect-ratio: 1 / 1; border-radius: 2px; background: linear-gradient(160deg, #D6C8E8 0%, #A996CC 100%)"><span class="pill" style="left: 6px">#006</span></div></figure>
        <figure class="pol" style="transform: rotate(-2deg)"><div class="ph" role="img" aria-label="Фото гостя, кадр 5" style="aspect-ratio: 1 / 1; border-radius: 2px; background: linear-gradient(160deg, #BFDCCB 0%, #8BB89D 100%)"><span class="pill" style="left: 6px">#005</span></div></figure>
      </div>
    </section>
  </div>
</div>
