# Render Blueprint: staging (ADR 0014). Deploys the `stage` branch after CI passes.
# Secrets are `sync: false`: Render asks for them when the Blueprint is created and they live
# only in the Render dashboard, never in this repository. Production gets its own Blueprint and
# credentials later (rule 17: staging and production never share data or secrets).

databases:
  - name: stepler-staging-db
    region: frankfurt
    plan: 0.1c-256mb
    diskSizeGB: 1
    postgresMajorVersion: '18'
    databaseName: stepler
    user: stepler
    # No public access: only services on the private network connect.
    ipAllowList: []

services:
  # The API is private: only the web service reaches it, over Render's private network.
  - type: pserv
    name: stepler-staging-api
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    branch: stage
    autoDeployTrigger: 'off'
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # Runs in the new image before it starts serving (docker/scripts/verify-images.sh tests it).
    preDeployCommand: node_modules/.bin/prisma migrate deploy
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: '4000'
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: stepler-staging-db
          property: connectionString
      # The only proxy in front of the API is the web service, which forwards one clean
      # X-Forwarded-For with the client IP.
      - key: API_TRUST_PROXY
        value: '1'
      - key: APP_SECRET
        generateValue: true
      # https://<web service>.onrender.com; must match exactly (CSRF origin, links, OAuth).
      - key: APP_ORIGIN
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OPERATOR_EMAILS
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  # Background jobs (ADR 0009): purges, sweeps, later media processing. No port, no public access.
  - type: worker
    name: stepler-staging-worker
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    branch: stage
    autoDeployTrigger: 'off'
    dockerfilePath: ./apps/api/worker.Dockerfile
    dockerContext: .
    # On SIGTERM the worker gives running jobs 25 s, then closes its clients (apps/api/src/worker/
    # shutdown.ts); Render's default grace is 30 s, this leaves headroom.
    maxShutdownDelaySeconds: 60
    # Also runs on the API; Prisma's advisory lock makes concurrent runs safe, and either service
    # deploying first finds the schema it needs.
    preDeployCommand: node_modules/.bin/prisma migrate deploy
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: stepler-staging-db
          property: connectionString
      # The same staging bucket as the API (Render cannot copy values between services).
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  - type: web
    name: stepler-staging
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    branch: stage
    autoDeployTrigger: 'off'
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: API_INTERNAL_HOSTPORT
        fromService:
          type: pserv
          name: stepler-staging-api
          property: hostport
      # Cloudflare (in front of Render) sets the real client IP here and overwrites any
      # client-sent value. X-Forwarded-For is not used: Render keeps the client-sent value first.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      # Staging runs on the placeholder legal texts until the real ones are published; production
      # never sets this (the server refuses to start on drafts, [C20]).
      - key: LEGAL_ALLOW_DRAFT
        value: 'true'
      # The privacy/abuse contact shown on /legal/*; a placeholder address is fine on staging.
      - key: LEGAL_CONTACT_EMAIL
        sync: false
