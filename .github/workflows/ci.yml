name: ci

# Minutes budget (owner decision 2026-10-05, the free Actions minutes ran out):
# - PRs into dev: secrets + quality + e2e on desktop Chrome only (one job). Implementers run the full
#   three-browser e2e locally before opening a PR.
# - Release PRs into stage/main and pushes to stage/main: the full matrix (three browsers in two
#   shards) and the Docker image checks. Render deploys stage only after these pass.
# - No second run after a merge into dev, and docs-only PRs skip CI.
on:
  pull_request:
    paths-ignore: ['docs/**']
  push:
    branches: [main, stage]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

# Actions are pinned to commit SHAs (supply chain); the comment shows the release.
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history, not only the last commit
      - name: Scan git history for secrets (gitleaks, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL -o gitleaks.tgz "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" checksums.txt | sed 's/ .*/  gitleaks.tgz/' | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git --no-banner --redact .

  quality:
    # Pinned: the media packages below are Ubuntu 24.04's (ubuntu-latest moves on).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - run: pnpm format:check
      # The worker's media tools (spike S5): heif-dec + the libde265 plugin for HEIC, ffmpeg for video,
      # exiftool for location stripping (ADR 0008 addendum 2026-10-05).
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libheif-examples libheif-plugin-libde265 ffmpeg libimage-exiftool-perl
      # Integration services from docker/compose.yaml with the committed local-only credentials.
      - run: docker compose -f docker/compose.yaml --env-file docker/.env.example up -d --wait
      - run: pnpm --filter @stepler/api storage:bootstrap
      # Storybook story tests run in a real browser.
      - run: pnpm --filter @stepler/ui exec playwright install --with-deps chromium
      - run: pnpm turbo run lint typecheck test build build-storybook
      - if: failure()
        name: Emulator logs on failure
        run: docker compose -f docker/compose.yaml --env-file docker/.env.example logs --tail 200 s3
      - name: Prisma migrations match the schema (no drift)
        env:
          SHADOW_DATABASE_URL: postgresql://stepler:stepler-local@127.0.0.1:5433/stepler_shadow
        run: pnpm --filter @stepler/api db:check

  e2e:
    needs: quality
    # Full matrix only for releases (see the budget note at the top).
    if: github.event_name == 'push' || github.base_ref == 'stage' || github.base_ref == 'main'
    # Pinned: the media packages below are Ubuntu 24.04's (ubuntu-latest moves on).
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    # Two Playwright shards in parallel keep each run well under the timeout. If a shard passes
    # 25 minutes, add a third (shard: [1, 2, 3] and --shard=N/3).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}-
      # The worker's media tools (spike S5): heif-dec + the libde265 plugin for HEIC, ffmpeg for video,
      # exiftool for location stripping (ADR 0008 addendum 2026-10-05).
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libheif-examples libheif-plugin-libde265 ffmpeg libimage-exiftool-perl
      # Integration services from docker/compose.yaml with the committed local-only credentials.
      - run: docker compose -f docker/compose.yaml --env-file docker/.env.example up -d --wait
      - run: pnpm --filter @stepler/api storage:bootstrap
      - run: pnpm --filter @stepler/e2e exec playwright install --with-deps chromium webkit
      - run: pnpm e2e -- --shard=${{ matrix.shard }}/2
      - if: failure()
        name: Emulator logs on failure
        run: docker compose -f docker/compose.yaml --env-file docker/.env.example logs --tail 200 s3
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: e2e/playwright-report
          retention-days: 7

  e2e-desktop:
    needs: quality
    # PRs into dev: one job, desktop Chrome only (see the budget note at the top).
    if: github.event_name == 'pull_request' && github.base_ref != 'stage' && github.base_ref != 'main'
    # Pinned: the media packages below are Ubuntu 24.04's (ubuntu-latest moves on).
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libheif-examples libheif-plugin-libde265 ffmpeg libimage-exiftool-perl
      - run: docker compose -f docker/compose.yaml --env-file docker/.env.example up -d --wait
      - run: pnpm --filter @stepler/api storage:bootstrap
      - run: pnpm --filter @stepler/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e -- --project=desktop-chrome
      - if: failure()
        name: Emulator logs on failure
        run: docker compose -f docker/compose.yaml --env-file docker/.env.example logs --tail 200 s3
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-desktop
          path: e2e/playwright-report
          retention-days: 7

  images:
    needs: quality
    if: github.event_name == 'push' || github.base_ref == 'stage' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash docker/scripts/verify-images.sh
